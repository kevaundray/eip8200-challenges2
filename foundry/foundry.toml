[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/", "evmification/=lib/evmification/src/"]

# The three settings below mirror lib/evmification/foundry.toml so that the
# vendored Solidity implementations are compiled exactly as their authors
# compile them. Changing them changes their measured gas.
via_ir = true
optimizer = true
optimizer_runs = 10000

# The challenge specification fixes the fork (`fork := .Osaka` in each
# Spec.lean initialState), so the cross-check must run under the same fork.
evm_version = "osaka"

# The reference vectors reach ~770M gas in a single call (MODEXP, RSA-2048),
# and a table test makes every call in one transaction.
gas_limit = 9999999999999

# The suite reads the frozen reference artifacts from the challenge
# directories rather than keeping a second copy of the bytecode. The
# writable cache holds the deliberately corrupted copies that
# LeanArtifact.t.sol uses to prove the provenance check can fail.
fs_permissions = [
    { access = "read", path = "../Challenge" },
    { access = "read-write", path = "./cache" },
]

[fmt]
line_length = 110
